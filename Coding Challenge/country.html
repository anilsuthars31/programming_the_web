<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>REST Countries Demo</title>
  <link rel="stylesheet" href="country.css">
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="logo">Where in the world ? </h1>
    </div>
    <div class ="dark-mode-toggle">
      <!-- missing `darkmode.gif` was causing a 404 in the console; replace with a small inline marker -->
      <span class="moon" aria-hidden="true">🌙</span>
      <button class="Dark-mode">Dark mode</button>
    </div>
  </header>

<div class="search-row">
        <input id="searchInput" type="search" placeholder="Search for a country...">
        <select id="regionFilter" >
          <option value="">Filter by Region</option>
          <option>Africa</option>
          <option>Americas</option>
          <option>Asia</option>
          <option>Europe</option>
          <option>Oceania</option>
        </select>
      </div>
  <main class="wrap-main-grid">
      

 <div class="country-card">
  <img src="https://flagcdn.com/de.svg" class="flag" alt="Flag">
  <div class="card-info">
    <h3 class="country-name">Germany</h3>
    <p>Population: 81,770,900</p>
    <p>Region: Europe</p>
    <p id ="capital">Capital: Berlin</p>
  </div>
  </div>

  <script src="country.js" defer></script>
</body>
</html>
