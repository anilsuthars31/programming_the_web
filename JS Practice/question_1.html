
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color Changer Palette</title>
  <link rel="stylesheet" href="question_1.css" />
</head>
<body>
  <h1>Color Changer Palette</h1>

  <div id="colorDisplay"></div>

  <div class="palette-container">
    <div class="color-box" data-color="lightcoral" style="background-color: lightcoral;"></div>
    <div class="color-box" data-color="aquamarine" style="background-color: aquamarine;"></div>
    <div class="color-box" data-color="lightgreen" style="background-color: lightgreen;"></div>
    <div class="color-box" data-color="lightblue" style="background-color: lightblue;"></div>
  </div>

  <button id="resetBtn">Reset</button>

  <script src="question_1.js"></script>
</body>
</html>
